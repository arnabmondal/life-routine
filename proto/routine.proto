syntax = "proto3";
package routine;
service RoutineService {
  rpc ListActivities (ListActivitiesRequest) returns (ActivitiesResponse);
  rpc CreateActivity (CreateActivityRequest) returns (ActivityResponse);
  rpc UpdateActivity (UpdateActivityRequest) returns (ActivityResponse);
  rpc DeleteActivity (ActivityId) returns (Empty);
  rpc ListTemplates (Empty) returns (TemplatesResponse);
  rpc SeedTemplates (Empty) returns (TemplatesResponse);
  rpc GetSummary (SummaryRequest) returns (SummaryResponse);
}
message Empty {}
message ActivityId { string id = 1; }
message ListActivitiesRequest { string from = 1; string to = 2; }
message Activity {
  string id = 1;
  string title = 2;
  string category = 3;
  string start_at = 4;
  string end_at = 5;
  string status = 6;
  string notes = 7;
  string completed_at = 8;
  string created_at = 9;
}
message ActivitiesResponse { repeated Activity activities = 1; }
message ActivityResponse { Activity activity = 1; }
message CreateActivityRequest { string title = 1; string category = 2; string start_at = 3; string end_at = 4; string notes = 5; }
message UpdateActivityRequest { string id = 1; string title = 2; string category = 3; string start_at = 4; string end_at = 5; string notes = 6; string status = 7; }
message Template { string id = 1; string title = 2; string category = 3; int32 weekday = 4; string start_time = 5; string end_time = 6; }
message TemplatesResponse { repeated Template templates = 1; }
message SummaryRequest { string from = 1; string to = 2; }
message CategoryStat { string category = 1; int32 planned = 2; int32 completed = 3; int32 minutes = 4; }
message SummaryResponse { int32 planned = 1; int32 completed = 2; int32 skipped = 3; repeated CategoryStat categories = 4; }
